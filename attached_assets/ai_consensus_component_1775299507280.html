<div class="ai-consensus-panel">
    <div class="consensus-header">
        <h3>🧠 AI Consensus Analysis</h3>
        <span class="badge">Trained on 3,500+ historical matches</span>
    </div>
    
    <div id="aiConsensusContent" class="consensus-content">
        <div class="loading">Generating AI analysis...</div>
    </div>
</div>

<style>
.ai-consensus-panel {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border-radius: 20px;
    padding: 20px;
    margin-top: 20px;
    color: #eee;
}

.consensus-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px solid #333;
    padding-bottom: 10px;
}

.consensus-header h3 {
    margin: 0;
    color: #fff;
}

.badge {
    background: #667eea;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    color: white;
}

.consensus-content {
    font-size: 14px;
    line-height: 1.6;
}

.insight-item {
    padding: 10px 0;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: flex-start;
    gap: 10px;
}

.insight-icon {
    font-size: 18px;
    min-width: 30px;
}

.insight-text {
    flex: 1;
}

.verdict-box {
    background: #0f0f1a;
    border-radius: 12px;
    padding: 15px;
    margin-top: 15px;
    border-left: 4px solid #667eea;
}

.verdict-title {
    font-weight: bold;
    margin-bottom: 8px;
    color: #667eea;
}

.historical-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-top: 15px;
    font-size: 12px;
}

.stat-card {
    background: #0f0f1a;
    padding: 8px;
    border-radius: 8px;
    text-align: center;
}

.stat-value {
    font-size: 18px;
    font-weight: bold;
    color: #667eea;
}

.loading {
    text-align: center;
    padding: 20px;
    color: #888;
}
</style>

<script>
function displayAIConsensus(consensus) {
    const container = document.getElementById('aiConsensusContent');
    
    if (!consensus || !consensus.insights) {
        container.innerHTML = '<div class="loading">⚠️ AI analysis unavailable</div>';
        return;
    }
    
    const insightsHtml = consensus.insights.map(insight => {
        let icon = '📊';
        if (insight.includes('League Context')) icon = '📊';
        else if (insight.includes('Form')) icon = '🏠';
        else if (insight.includes('Head-to-Head')) icon = '⚔️';
        else if (insight.includes('VALUE')) icon = '💰';
        else if (insight.includes('Verdict')) icon = '🎯';
        else icon = '📌';
        
        return `
            <div class="insight-item">
                <div class="insight-icon">${icon}</div>
                <div class="insight-text">${insight}</div>
            </div>
        `;
    }).join('');
    
    container.innerHTML = `
        ${insightsHtml}
        
        <div class="verdict-box">
            <div class="verdict-title">🎯 AI VERDICT</div>
            <div>${consensus.verdict || 'Analysis complete'}</div>
        </div>
        
        ${consensus.historical_context ? `
        <div class="historical-stats">
            ${consensus.historical_context.league_trends ? `
                <div class="stat-card">
                    <div class="stat-value">${(consensus.historical_context.league_trends.avg_total_goals || 2.5).toFixed(1)}</div>
                    <div>League Avg Goals</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${((consensus.historical_context.league_trends.over_2_5_rate || 0.5) * 100).toFixed(0)}%</div>
                    <div>Over 2.5 Rate</div>
                </div>
            ` : ''}
            ${consensus.historical_context.home_form ? `
                <div class="stat-card">
                    <div class="stat-value">${consensus.historical_context.home_form.avg_goals_scored.toFixed(1)}</div>
                    <div>Home Goals (Recent)</div>
                </div>
            ` : ''}
        </div>
        ` : ''}
    `;
}
</script>
